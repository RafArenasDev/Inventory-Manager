name: keep-alive

# Tanto el plan free de Render (el web service se duerme tras ~15 min sin
# tráfico, cold-start de 50+ segundos en el próximo request) como el de
# Aiven (la base de datos se apaga sola tras un período de inactividad más
# largo) necesitan actividad real y periódica para no dormirse — justo lo
# que rompe el link cuando alguien lo abre para una demo o un portfolio.
#
# Se pega a /login (no a /up) a propósito: /up es el health-check liviano
# de Laravel y no toca la base de datos ni la sesión, así que mantendría
# despierto el web service pero NO contaría como actividad para Aiven.
# /login sí pasa por el middleware normal (sesión en BD vía SESSION_DRIVER)
# y por el share de Inertia que consulta la tabla de módulos, así que cada
# ping toca tanto Render como la base de datos real.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the deployed app to keep Render + the Aiven DB awake
        run: curl -sf -o /dev/null -w "HTTP %{http_code}\n" https://inventory-manager-rafael.onrender.com/login
