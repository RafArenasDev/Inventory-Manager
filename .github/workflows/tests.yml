name: tests

# Tests en pausa durante el MVP (ver REFACTOR-PLAN.md punto 7) — los tests
# heredados del scaffold de Breeze (tests/Feature/Auth, Settings, etc.) no
# se mantienen al día con los cambios reales de la app, y este workflow no
# levanta ningún servicio de base de datos (ni MySQL ni Postgres), así que
# fallaban en cada push sin importar el motor. Disparo manual únicamente
# ("Run workflow" en la pestaña Actions) mientras dure esta fase.
on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Tests
        run: ./vendor/bin/phpunit
